<svg width="700" height="320" viewBox="0 0 700 320"
xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="scan" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
    <stop offset="50%" stop-color="#22D3EE"/>
    <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>

<!-- interface -->

<rect
  x="40"
  y="30"
  width="620"
  height="250"
  rx="12"
  fill="#070B10"
  stroke="#1E293B"
/>

<!-- header -->

<text
  x="70"
  y="65"
  fill="#22D3EE"
  font-family="monospace"
  font-size="12"
  letter-spacing="3"
>
AI VISION
</text>

<text
  x="630"
  y="65"
  text-anchor="end"
  fill="#64748B"
  font-family="monospace"
  font-size="10"
>
COMPUTER VISION
</text>

<!-- viewport -->

<rect
  x="70"
  y="90"
  width="350"
  height="150"
  rx="6"
  fill="#0B1118"
  stroke="#172033"
/>

<!-- object -->

<path
  d="M180 190
     C180 145 210 115 245 115
     C280 115 310 145 310 190
     L295 215
     L195 215
     Z"
  fill="#111827"
  stroke="#22D3EE"
  stroke-width="2"
  opacity="0.9"
/>

<!-- bounding box -->

<path
  d="M165 105 H325
     M165 105 V225
     M325 105 V225
     M165 225 H325"
  fill="none"
  stroke="#22D3EE"
  stroke-width="1"
  stroke-dasharray="8 5"
  opacity="0.8"
/>

<!-- scanning line -->

<rect
  x="165"
  y="105"
  width="160"
  height="2"
  fill="url(#scan)"
  filter="url(#glow)"
>

  <animate
    attributeName="y"
    values="105;225;105"
    dur="2.8s"
    repeatCount="indefinite"
  />

</rect>

<!-- detection points -->

<circle
  cx="210"
  cy="150"
  r="3"
  fill="#22D3EE"
  filter="url(#glow)"
/>

<circle
  cx="280"
  cy="165"
  r="3"
  fill="#22D3EE"
  filter="url(#glow)"
/>

<!-- data panel -->

<text
  x="450"
  y="105"
  fill="#64748B"
  font-family="monospace"
  font-size="10"
>
CLASS
</text>

<text
  x="450"
  y="125"
  fill="#E2E8F0"
  font-family="monospace"
  font-size="16"
  font-weight="bold"
>
UNIFORME
</text>

<text
  x="450"
  y="160"
  fill="#64748B"
  font-family="monospace"
  font-size="10"
>
CONFIDENCE
</text>

<text
  x="450"
  y="180"
  fill="#22D3EE"
  font-family="monospace"
  font-size="18"
  font-weight="bold"
>
94.8%
</text>

<text
  x="450"
  y="215"
  fill="#64748B"
  font-family="monospace"
  font-size="10"
>
STATUS
</text>

<text
  x="450"
  y="235"
  fill="#22D3EE"
  font-family="monospace"
  font-size="12"
>
● ANALYZING
</text>

<!-- footer -->

<text
  x="70"
  y="265"
  fill="#475569"
  font-family="monospace"
  font-size="9"
>
CAPTURE → PROCESSING → CLASSIFICATION
</text>

</svg>