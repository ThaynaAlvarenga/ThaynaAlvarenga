<svg width="700" height="320" viewBox="0 0 700 320"
xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#22D3EE"/>
    <stop offset="50%" stop-color="#3B82F6"/>
    <stop offset="100%" stop-color="#8B5CF6"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>

<!-- Interface -->

<rect
  x="40"
  y="30"
  width="620"
  height="250"
  rx="12"
  fill="#070B10"
  stroke="#1E293B"
/>

<!-- Header -->

<text
  x="70"
  y="65"
  fill="#22D3EE"
  font-family="monospace"
  font-size="12"
  letter-spacing="3"
>
DOCUMENT AI
</text>

<text
  x="630"
  y="65"
  text-anchor="end"
  fill="#64748B"
  font-family="monospace"
  font-size="10"
>
DATA EXTRACTION
</text>

<!-- Document -->

<rect
  x="70"
  y="95"
  width="145"
  height="155"
  rx="5"
  fill="#0B1118"
  stroke="#334155"
/>

<text
  x="90"
  y="120"
  fill="#E2E8F0"
  font-family="monospace"
  font-size="11"
>
INVOICE
</text>

<text
  x="90"
  y="140"
  fill="#64748B"
  font-family="monospace"
  font-size="8"
>
#98342
</text>

<!-- document lines -->

<g
  stroke="#334155"
  stroke-width="3"
  stroke-linecap="round"
>

  <line x1="90" y1="160" x2="190" y2="160"/>
  <line x1="90" y1="175" x2="175" y2="175"/>
  <line x1="90" y1="190" x2="190" y2="190"/>
  <line x1="90" y1="205" x2="165" y2="205"/>

</g>

<!-- highlighted field -->

<rect
  x="87"
  y="218"
  width="105"
  height="18"
  rx="3"
  fill="#22D3EE"
  opacity="0.08"
  stroke="#22D3EE"
  stroke-width="1"
/>

<text
  x="95"
  y="231"
  fill="#22D3EE"
  font-family="monospace"
  font-size="8"
>
$ 12.430,00
</text>

<!-- OCR scanner -->

<rect
  x="70"
  y="95"
  width="145"
  height="2"
  fill="url(#flow)"
  filter="url(#glow)"
>

  <animate
    attributeName="y"
    values="95;250;95"
    dur="2.5s"
    repeatCount="indefinite"
  />

</rect>

<!-- Arrow -->

<path
  d="M235 172 H295"
  stroke="#22D3EE"
  stroke-width="2"
  stroke-dasharray="7 7"
>

  <animate
    attributeName="stroke-dashoffset"
    from="0"
    to="-28"
    dur="1.2s"
    repeatCount="indefinite"
  />

</path>

<path
  d="M288 165 L298 172 L288 179"
  fill="none"
  stroke="#22D3EE"
  stroke-width="2"
/>

<text
  x="265"
  y="150"
  text-anchor="middle"
  fill="#64748B"
  font-family="monospace"
  font-size="8"
>
OCR
</text>

<!-- Processing -->

<rect
  x="310"
  y="105"
  width="105"
  height="135"
  rx="6"
  fill="#0B1118"
  stroke="#1E293B"
/>

<text
  x="362"
  y="130"
  text-anchor="middle"
  fill="#22D3EE"
  font-family="monospace"
  font-size="9"
>
PROCESSING
</text>

<!-- Processing nodes -->

<circle cx="335" cy="155" r="4" fill="#22D3EE">
  <animate
    attributeName="opacity"
    values="0.2;1;0.2"
    dur="1s"
    repeatCount="indefinite"
  />
</circle>

<circle cx="362" cy="155" r="4" fill="#3B82F6">
  <animate
    attributeName="opacity"
    values="1;0.2;1"
    dur="1s"
    repeatCount="indefinite"
  />
</circle>

<circle cx="389" cy="155" r="4" fill="#8B5CF6">
  <animate
    attributeName="opacity"
    values="0.2;1;0.2"
    dur="1s"
    repeatCount="indefinite"
  />
</circle>

<line
  x1="335"
  y1="185"
  x2="390"
  y2="185"
  stroke="#334155"
  stroke-width="2"
/>

<line
  x1="335"
  y1="200"
  x2="375"
  y2="200"
  stroke="#334155"
  stroke-width="2"
/>

<text
  x="362"
  y="225"
  text-anchor="middle"
  fill="#64748B"
  font-family="monospace"
  font-size="8"
>
EXTRACTING...
</text>

<!-- Arrow to JSON -->

<path
  d="M430 172 H465"
  stroke="#3B82F6"
  stroke-width="2"
  stroke-dasharray="7 7"
>

  <animate
    attributeName="stroke-dashoffset"
    from="0"
    to="-28"
    dur="1.2s"
    repeatCount="indefinite"
  />

</path>

<!-- JSON -->

<rect
  x="480"
  y="95"
  width="145"
  height="155"
  rx="6"
  fill="#0B1118"
  stroke="#334155"
/>

<text
  x="500"
  y="120"
  fill="#8B5CF6"
  font-family="monospace"
  font-size="10"
>
JSON OUTPUT
</text>

<text
  x="500"
  y="145"
  fill="#64748B"
  font-family="monospace"
  font-size="9"
>
{
</text>

<text
  x="510"
  y="162"
  fill="#22D3EE"
  font-family="monospace"
  font-size="8"
>
"invoice":
</text>

<text
  x="575"
  y="162"
  fill="#E2E8F0"
  font-family="monospace"
  font-size="8"
>
"98342"
</text>

<text
  x="510"
  y="180"
  fill="#22D3EE"
  font-family="monospace"
  font-size="8"
>
"total":
</text>

<text
  x="565"
  y="180"
  fill="#E2E8F0"
  font-family="monospace"
  font-size="8"
>
12430
</text>

<text
  x="510"
  y="198"
  fill="#22D3EE"
  font-family="monospace"
  font-size="8"
>
"status":
</text>

<text
  x="570"
  y="198"
  fill="#22D3EE"
  font-family="monospace"
  font-size="8"
>
"valid"
</text>

<text
  x="500"
  y="216"
  fill="#64748B"
  font-family="monospace"
  font-size="9"
>
}
</text>

<!-- Footer -->

<text
  x="70"
  y="265"
  fill="#475569"
  font-family="monospace"
  font-size="9"
>
DOCUMENT → OCR → EXTRACTION → STRUCTURED DATA
</text>

</svg>