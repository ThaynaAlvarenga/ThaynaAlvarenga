<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <radialGradient id="coreGlow">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Background glow -->

  <circle
    cx="150"
    cy="150"
    r="105"
    fill="url(#coreGlow)"
    opacity="0.35"
  />

  <!-- Outer rotating ring -->

  <circle
    cx="150"
    cy="150"
    r="105"
    fill="none"
    stroke="url(#ringGradient)"
    stroke-width="1"
    stroke-dasharray="5 12"
    opacity="0.55"
  >

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 150 150"
      to="360 150 150"
      dur="18s"
      repeatCount="indefinite"
    />

  </circle>

  <!-- Second ring -->

  <circle
    cx="150"
    cy="150"
    r="82"
    fill="none"
    stroke="#22D3EE"
    stroke-width="1"
    stroke-dasharray="2 8"
    opacity="0.7"
  >

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="360 150 150"
      to="0 150 150"
      dur="12s"
      repeatCount="indefinite"
    />

  </circle>

  <!-- Connection lines -->

  <g
    stroke="#22D3EE"
    stroke-width="1"
    opacity="0.45"
  >

    <line x1="150" y1="67" x2="150" y2="108"/>
    <line x1="150" y1="192" x2="150" y2="233"/>

    <line x1="67" y1="150" x2="108" y2="150"/>
    <line x1="192" y1="150" x2="233" y2="150"/>

    <line x1="91" y1="91" x2="121" y2="121"/>
    <line x1="179" y1="179" x2="209" y2="209"/>

    <line x1="209" y1="91" x2="179" y2="121"/>
    <line x1="121" y1="179" x2="91" y2="209"/>

  </g>

  <!-- Orbit nodes -->

  <g fill="#22D3EE" filter="url(#glow)">

    <circle cx="150" cy="67" r="4"/>
    <circle cx="150" cy="233" r="4"/>
    <circle cx="67" cy="150" r="4"/>
    <circle cx="233" cy="150" r="4"/>

  </g>

  <!-- Central core -->

  <circle
    cx="150"
    cy="150"
    r="42"
    fill="#070B10"
    stroke="#22D3EE"
    stroke-width="2"
  />

  <circle
    cx="150"
    cy="150"
    r="25"
    fill="#22D3EE"
    opacity="0.12"
  >

    <animate
      attributeName="r"
      values="22;28;22"
      dur="3s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="0.10;0.25;0.10"
      dur="3s"
      repeatCount="indefinite"
    />

  </circle>

  <!-- Core -->

  <circle
    cx="150"
    cy="150"
    r="10"
    fill="#22D3EE"
    filter="url(#glow)"
  >

    <animate
      attributeName="r"
      values="8;12;8"
      dur="2s"
      repeatCount="indefinite"
    />

  </circle>

  <!-- Inner core symbol -->

  <circle
    cx="150"
    cy="150"
    r="3"
    fill="#FFFFFF"
  />

</svg>