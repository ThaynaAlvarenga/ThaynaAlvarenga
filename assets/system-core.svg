<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="45%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer orbital ring -->
  <circle
    cx="90"
    cy="90"
    r="68"
    fill="none"
    stroke="#164e63"
    stroke-width="1"
    stroke-dasharray="4 8"
    opacity="0.8">

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 90 90"
      to="360 90 90"
      dur="12s"
      repeatCount="indefinite"/>
  </circle>

  <!-- Inner orbital ring -->
  <ellipse
    cx="90"
    cy="90"
    rx="52"
    ry="22"
    fill="none"
    stroke="#22d3ee"
    stroke-width="1"
    opacity="0.6">

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 90 90"
      to="360 90 90"
      dur="6s"
      repeatCount="indefinite"/>
  </ellipse>

  <!-- Core glow -->
  <circle
    cx="90"
    cy="90"
    r="27"
    fill="url(#core)"
    filter="url(#glow)">

    <animate
      attributeName="r"
      values="25;29;25"
      dur="2s"
      repeatCount="indefinite"/>
  </circle>

  <!-- Core -->
  <circle
    cx="90"
    cy="90"
    r="9"
    fill="#e0f2fe">

    <animate
      attributeName="opacity"
      values="1;0.65;1"
      dur="1.5s"
      repeatCount="indefinite"/>
  </circle>

  <!-- Orbit nodes -->
  <circle cx="90" cy="22" r="3" fill="#22d3ee">
    <animate
      attributeName="opacity"
      values="1;0.3;1"
      dur="1.8s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="158" cy="90" r="3" fill="#22d3ee">
    <animate
      attributeName="opacity"
      values="0.3;1;0.3"
      dur="2.2s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="90" cy="158" r="3" fill="#22d3ee">
    <animate
      attributeName="opacity"
      values="1;0.3;1"
      dur="2s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="22" cy="90" r="3" fill="#22d3ee">
    <animate
      attributeName="opacity"
      values="0.3;1;0.3"
      dur="1.7s"
      repeatCount="indefinite"/>
  </circle>

</svg>